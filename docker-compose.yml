services:
  backend:
    build:
      context: ./backend
    container_name: cloudops-backend
    # Explicitly exposing internally, no longer mapping to host
    expose:
      - "5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    networks:
      - cloudops-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cloudops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudops-network
    restart: unless-stopped

networks:
  cloudops-network:
    driver: bridge