services:
  backend:
    build:
      context: ./backend
    container_name: cloudops-backend
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cloudops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped